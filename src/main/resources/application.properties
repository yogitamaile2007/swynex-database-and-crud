spring.application.name=SWYNEX-Database-and-CRUD
server.port=8086
# ---- MySQL connection (CHANGE username/password to yours) ----
spring.datasource.url=jdbc:mysql://localhost:3306/swynex_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password

# ---- Hibernate / JPA ----
# "update" = tables are created automatically the first time you run the app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
